[package]
name = "milli-http"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A no_std HTTP/1.1, HTTP/2, HTTP/3 + QUIC + TLS 1.3 stack for embedded systems"
repository = "https://github.com/computer-whisperer/milli-http"
readme = "README.md"
keywords = ["no-std", "embedded", "http3", "quic", "tls"]
categories = ["embedded", "no-std", "network-programming", "web-programming"]
exclude = ["/rfc", "/docs", "/fuzz", "/.github", "/tests/curl_interop.sh", "/examples/*.sh", "/examples/*.py"]

[features]
default = ["quic", "h3", "rustcrypto-chacha"]
quic = []
http = []
h2 = ["http"]
h3 = ["quic", "http"]
http1 = ["http"]
tcp-tls = ["http"]
alloc = []
std = []
rustcrypto-chacha = ["dep:chacha20poly1305", "dep:chacha20", "dep:aes-gcm", "dep:aes", "dep:hkdf", "dep:hmac"]
rustcrypto-aes = ["dep:aes-gcm", "dep:aes", "dep:hkdf", "dep:hmac"]
discovery = []
server = ["alloc", "tcp-tls", "http"]

[dependencies]
heapless = "0.8"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
ed25519-dalek = { version = "2", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", default-features = false }

# RustCrypto - all no_std compatible
chacha20poly1305 = { version = "0.10", default-features = false, optional = true }
chacha20 = { version = "0.9", default-features = false, optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes"], optional = true }
aes = { version = "0.8", default-features = false, optional = true }
hkdf = { version = "0.12", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }

[dev-dependencies]
hex-literal = "0.4"
rand = "0.9"
# hyper/rustls interop bench (tests/hyper_interop.rs): a mainstream h2 client
# against ServerRunner over real TCP. Dev-only; the library itself stays
# no_std.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }

[[test]]
name = "hyper_interop"
required-features = ["server", "h2", "tcp-tls", "http1", "rustcrypto-aes", "std", "alloc"]

[[example]]
name = "h3_server"
required-features = ["h3", "rustcrypto-chacha"]

[[example]]
name = "h3_client"
required-features = ["h3", "rustcrypto-chacha"]

[[example]]
name = "h2_server"
required-features = ["h2"]

[[example]]
name = "h2_client"
required-features = ["h2"]

[[example]]
name = "http1_server"
required-features = ["http1"]

[[example]]
name = "http1_client"
required-features = ["http1"]

[[example]]
name = "https1_server"
required-features = ["http1", "tcp-tls", "rustcrypto-chacha"]

[[example]]
name = "h2_tls_server"
required-features = ["h2", "tcp-tls", "rustcrypto-chacha"]

[[example]]
name = "multi_server"
required-features = ["h3", "h2", "rustcrypto-chacha"]

[[example]]
name = "https1_client"
required-features = ["http1", "tcp-tls", "rustcrypto-chacha"]

[[example]]
name = "h2_tls_client"
required-features = ["h2", "tcp-tls", "rustcrypto-chacha"]

[[example]]
name = "omni_client"
required-features = ["h3", "h2", "http1", "rustcrypto-chacha"]
